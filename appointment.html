<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Appointments</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --primary: #4a148c;
      --primary-light: #7b1fa2;
      --bg: #f8f9fe;
      --card-bg: #ffffff;
      --text-main: #2d3436;
      --text-muted: #636e72;
      --border: #f0f0f5;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(74, 20, 140, 0.05);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Filter Card */
    .filter-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: flex-end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 150px;
    }

    .filter-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-group select, .filter-group input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .filter-group select:focus, .filter-group input:focus {
      border-color: var(--primary);
    }

    .btn-filter {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .btn-filter:hover {
      background: var(--primary-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(74, 20, 140, 0.2);
    }

    /* Table Card */
    .table-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #fcfcfd;
      padding: 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr.cancelled {
      background-color: #fffafa;
      opacity: 0.8;
    }

    tr.checked-row {
      background-color: #f6fff8;
    }

    .patient-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .patient-name {
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      transition: color 0.3s;
    }

    .patient-name:hover {
      color: var(--primary);
    }

    .type-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: #eee;
      width: fit-content;
    }

    .status-tag {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-confirmed { background: #e8f5e9; color: #2e7d32; }
    .status-cancelled { background: #ffebee; color: #c62828; }

    .view-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      background: #f3e5f5;
      color: var(--primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .view-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* Custom Checkbox */
    .viewed-check {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    @media (max-width: 768px) {
      .filter-card { flex-direction: column; align-items: stretch; }
      .filter-group { min-width: 100%; }
      td, th { padding: 12px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1><i class="ri-calendar-check-line"></i> All Appointments</h1>
  </div>

  <div class="filter-card">
    <div class="filter-group">
      <label>Status</label>
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="confirmed">Confirmed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <div class="filter-group">
      <label>From Date</label>
      <input type="date" id="fromDate">
    </div>

    <div class="filter-group">
      <label>To Date</label>
      <input type="date" id="toDate">
    </div>

    <div class="filter-group">
      <label>Quick Period</label>
      <select id="periodFilter">
        <option value="">Select Period</option>
        <option value="7">Last 7 Days</option>
        <option value="30">Last 30 Days</option>
        <option value="90">Last 90 Days</option>
      </select>
    </div>

    <button id="filterBtn" class="btn-filter">
      <i class="ri-filter-3-line"></i> Apply Filters
    </button>
  </div>

  <div class="table-card">
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">Seen</th>
            <th>Patient Details</th>
            <th>Contact</th>
            <th>Doctor</th>
            <th>Appointment Date</th>
            <th>Fee</th>
            <th>Status</th>
            <th style="text-align: right;">Action</th>
          </tr>
        </thead>
        <tbody id="appointmentsTable">
          <!-- Data will be loaded here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const tableBody = document.getElementById('appointmentsTable');
  const filterBtn = document.getElementById('filterBtn');

  function buildQuery() {
    const status = document.getElementById('statusFilter').value;
    const from = document.getElementById('fromDate').value;
    const to = document.getElementById('toDate').value;
    const period = document.getElementById('periodFilter').value;
    const q = [];
    if (status) q.push(`status=${encodeURIComponent(status)}`);
    if (from) q.push(`from=${encodeURIComponent(from)}`);
    if (to) q.push(`to=${encodeURIComponent(to)}`);
    if (period) q.push(`period=${encodeURIComponent(period)}`);
    return q.length ? `?${q.join('&')}` : '';
  }

  async function fetchAppointments() {
    tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:40px; color:var(--text-muted);"><i class="ri-loader-4-line ri-spin" style="font-size:24px;"></i><br>Fetching appointments...</td></tr>`;
    
    try {
      const url = `https://jainsewa-backend.onrender.com/api/admin/appointments${buildQuery()}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Failed to fetch appointments");
      
      let data = await res.json();
      data.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

      tableBody.innerHTML = '';
      if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:40px; color:var(--text-muted);">No appointments found for the selected criteria.</td></tr>`;
        return;
      }

      data.forEach(appt => {
        const row = document.createElement('tr');
        if (appt.status === 'cancelled') row.classList.add('cancelled');
        if (appt.viewed) row.classList.add('checked-row');

        const dateStr = appt.date ? new Date(appt.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
        const createdStr = appt.createdAt ? new Date(appt.createdAt).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-';

        row.innerHTML = `
          <td>
            <input type="checkbox" class="viewed-check" ${appt.viewed ? "checked" : ""}>
          </td>
          <td>
            <div class="patient-cell">
              <a href="patient-details.html?id=${appt._id}" class="patient-name">${appt.patient?.name || "Unknown"}</a>
              <span class="type-tag" style="background: ${appt.patientType === 'family' ? '#f3e5f5' : '#e3f2fd'}; color: ${appt.patientType === 'family' ? '#7b1fa2' : '#1976d2'};">
                ${appt.patientType === 'family' ? 'Family' : 'Self'}
              </span>
            </div>
          </td>
          <td style="font-size: 13px;">
            <div style="font-weight:600;">${appt.userMobile || '-'}</div>
            <div style="color:var(--text-muted); font-size:11px;">${appt.patientEmail || appt.userEmail || '-'}</div>
          </td>
          <td style="font-weight:600;">${appt.doctor || 'General'}</td>
          <td>
            <div style="font-weight:600;">${dateStr}</div>
            <div style="font-size:11px; color:var(--text-muted);">Booked: ${createdStr}</div>
          </td>
          <td style="font-weight:700; color:var(--primary);">₹${appt.fee != null ? appt.fee : 0}</td>
          <td>
            <span class="status-tag status-${appt.status || 'confirmed'}">${appt.status || 'confirmed'}</span>
          </td>
          <td style="text-align: right;">
            <a href="patient-details.html?id=${appt._id}" class="view-btn">
              <i class="ri-eye-line"></i> View
            </a>
          </td>
        `;

        const checkbox = row.querySelector(".viewed-check");
        checkbox.addEventListener("change", async () => {
          const viewed = checkbox.checked;
          row.classList.toggle('checked-row', viewed);

          try {
            await fetch(`https://jainsewa-backend.onrender.com/api/admin/appointments/${appt._id}/viewed`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ viewed })
            });
          } catch (err) {
            console.error("Error updating viewed:", err);
          }
        });

        tableBody.appendChild(row);
      });
    } catch (err) {
      console.error(err);
      tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:40px; color:#c62828;"><i class="ri-error-warning-line"></i> Error fetching appointments. Please try again.</td></tr>`;
    }
  }

  filterBtn.addEventListener('click', fetchAppointments);

  // Initial load
  fetchAppointments();
</script>

</body>
</html>
