<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registered Users | Admin</title>
    
    <!-- Fonts + Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" />

    <style>
      :root {
        --primary: #4a148c;
        --primary-light: #7b1fa2;
        --bg: #f8f9fe;
        --card-bg: #ffffff;
        --text-main: #2d3436;
        --text-muted: #636e72;
        --border: #f0f0f5;
        --radius: 12px;
        --shadow: 0 10px 30px rgba(74, 20, 140, 0.05);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        flex-wrap: wrap;
        gap: 20px;
      }

      .header h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--primary);
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* Search Card */
      .search-card {
        background: var(--card-bg);
        padding: 20px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        margin-bottom: 30px;
        display: flex;
        gap: 15px;
      }

      .search-group {
        flex: 1;
        position: relative;
      }

      .search-group i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 18px;
      }

      .search-group input {
        width: 100%;
        padding: 12px 15px 12px 45px;
        border-radius: 10px;
        border: 1px solid #ddd;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
      }

      .search-group input:focus {
        border-color: var(--primary);
      }

      .btn-search {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0 25px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      .btn-search:hover {
        background: var(--primary-light);
      }

      /* Table Card */
      .table-card {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        overflow: hidden;
      }

      .table-responsive {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th {
        background-color: #fcfcfd;
        padding: 16px;
        font-size: 12px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--border);
      }

      td {
        padding: 16px;
        font-size: 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      tr.blocked {
        background-color: #fffafa;
        opacity: 0.8;
      }

      .user-name {
        font-weight: 700;
        color: var(--text-main);
      }

      .role-tag {
        font-size: 11px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 20px;
        background: #eee;
        text-transform: uppercase;
      }

      .role-admin { background: #fff3e0; color: #ef6c00; }
      .role-user { background: #e3f2fd; color: #1976d2; }
      .role-doctor { background: #f3e5f5; color: #7b1fa2; }

      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
      }
      .status-active { background: #4caf50; }
      .status-blocked { background: #f44336; }

      @media (max-width: 768px) {
        .search-card { flex-direction: column; }
        .btn-search { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1><i class="ri-group-line"></i> Registered Users</h1>
      </div>

      <div class="search-card">
        <div class="search-group">
          <i class="ri-search-line"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search by name, email, or mobile number..."
          />
        </div>
        <button id="searchBtn" class="btn-search">Search Users</button>
      </div>

      <div class="table-card">
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>User Details</th>
                <th>Gender</th>
                <th>DOB</th>
                <th>Location</th>
                <th>Disease</th>
                <th>Reg. Center</th>
                <th>Role</th>
                <th>Status</th>
                <th>Joined</th>
              </tr>
            </thead>
            <tbody id="usersTable">
              <!-- Data loaded here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const usersTable = document.getElementById("usersTable");
      const searchBtn = document.getElementById("searchBtn");
      const searchInput = document.getElementById("searchInput");

      async function fetchUsers(search = "") {
        usersTable.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:40px; color:var(--text-muted);"><i class="ri-loader-4-line ri-spin" style="font-size:24px;"></i><br>Loading users...</td></tr>`;
        
        try {
          const url = `https://jainsewa-backend.onrender.com/api/admin/users${search ? "?search=" + encodeURIComponent(search) : ""}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("Failed to fetch users");
          const data = await res.json();

          usersTable.innerHTML = "";
          if (data.length === 0) {
            usersTable.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:40px; color:var(--text-muted);">No users found.</td></tr>`;
            return;
          }

          data.forEach((u) => {
            const roleClass = `role-${u.role.toLowerCase()}`;
            const statusText = u.blocked ? "Blocked" : "Active";
            const statusClass = u.blocked ? "status-blocked" : "status-active";

            const row = document.createElement("tr");
            if (u.blocked) row.classList.add("blocked");

            row.innerHTML = `
              <td>
                <div style="font-weight:700;">${u.firstName} ${u.lastName}</div>
                <div style="font-size:12px; color:var(--text-muted);">${u.mobile}</div>
                <div style="font-size:11px; color:var(--text-muted);">${u.email || "-"}</div>
              </td>
              <td style="text-transform: capitalize;">${u.gender}</td>
              <td>${u.dob || "-"}</td>
              <td>
                <div style="font-weight:600;">${u.city || "-"}</div>
                <div style="font-size:11px; color:var(--text-muted);">${u.state || "-"}</div>
              </td>
              <td style="font-size: 13px;">${u.disease || "-"}</td>
              <td style="font-size: 13px;">${u.registrationCenter || "-"}</td>
              <td><span class="role-tag ${roleClass}">${u.role}</span></td>
              <td>
                <span class="status-dot ${statusClass}"></span>
                <span style="font-size: 13px; font-weight: 500;">${statusText}</span>
              </td>
              <td style="font-size: 12px; color: var(--text-muted);">
                ${new Date(u.createdAt).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}
              </td>
            `;
            usersTable.appendChild(row);
          });
        } catch (err) {
          console.error(err);
          usersTable.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:40px; color:#c62828;"><i class="ri-error-warning-line"></i> Error loading users.</td></tr>`;
        }
      }

      searchBtn.addEventListener("click", () => fetchUsers(searchInput.value));
      searchInput.addEventListener("keypress", (e) => {
        if (e.key === 'Enter') fetchUsers(searchInput.value);
      });

      // Initial load
      fetchUsers();
    </script>
  </body>
</html>
