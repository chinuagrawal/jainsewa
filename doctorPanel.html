<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Dashboard | JainSewa</title>

    <!-- Fonts + Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #4a148c;
        --primary-light: #7b1fa2;
        --sidebar-bg: #1e1e2f;
        --bg: #f4f7fe;
        --white: #ffffff;
        --text-main: #2d3436;
        --text-muted: #a0a0c0;
        --radius: 16px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        display: flex;
        height: 100vh;
        background-color: var(--bg);
        overflow: hidden;
      }

      /* Sidebar */
      .sidebar {
        width: 260px;
        background: var(--sidebar-bg);
        color: white;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 30px 20px;
        transition: var(--transition);
        z-index: 1000;
      }

      .sidebar-header {
        padding: 0 10px 40px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-light)
        );
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 18px;
      }

      .sidebar-header h2 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .nav-links {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 15px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
        border-radius: 12px;
        transition: var(--transition);
        cursor: pointer;
      }

      .nav-item i {
        font-size: 18px;
      }

      .nav-item:hover,
      .nav-item.active {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .nav-item.active {
        background: var(--primary);
      }

      .sidebar-footer {
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .logout-btn {
        color: #ff5252;
      }

      /* Content Area */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 25px;
        position: relative;
      }

      .content-card {
        flex: 1;
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      iframe {
        flex: 1;
        width: 100%;
        border: none;
      }

      .welcome-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
        animation: fadeIn 0.8s ease-out;
      }

      .welcome-container h1 {
        font-size: 36px;
        font-weight: 800;
        color: var(--primary);
        margin-bottom: 15px;
      }

      .welcome-container p {
        font-size: 16px;
        color: var(--text-main);
        opacity: 0.7;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Mobile Menu */
      .hamburger {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        width: 45px;
        height: 45px;
        background: var(--sidebar-bg);
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        z-index: 1100;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      @media (max-width: 992px) {
        .sidebar {
          position: fixed;
          left: -260px;
        }
        .sidebar.show {
          left: 0;
        }
        .hamburger {
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 20px;
        }
        .main-content {
          padding: 80px 15px 15px;
        }
      }
    </style>
  </head>
  <body>
    <button class="hamburger" id="hamburger">
      <i class="ri-menu-2-line"></i>
    </button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">JS</div>
        <h2>JainSewa</h2>
      </div>

      <nav class="nav-links">
        <div class="nav-item active" onclick="loadRecentBookings(this)">
          <i class="ri-calendar-event-line"></i> Appointments
        </div>
        <div class="nav-item" onclick="loadregisteredUsers(this)">
          <i class="ri-group-line"></i> Registered Users
        </div>
        <div class="nav-item" onclick="loadSeatStatus(this)">
          <i class="ri-hotel-bed-line"></i> Seat Status
        </div>
        <div class="nav-item" onclick="loadCashRequestPage(this)">
          <i class="ri-money-dollar-circle-line"></i> Cash Requests
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="nav-item logout-btn" onclick="logout()">
          <i class="ri-logout-box-r-line"></i> Logout
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="content-card" id="mainContent">
        <div class="welcome-container">
          <i
            class="ri-user-heart-line"
            style="font-size: 64px; color: var(--primary); margin-bottom: 20px"
          ></i>
          <h1>Welcome, Dr. Pritam!</h1>
          <p>
            Please select an option from the sidebar to manage your practice.
          </p>
        </div>
      </div>
    </main>

    <script>
      // ✅ Protect admin page
      const user = JSON.parse(localStorage.getItem("user"));
      if (!user || user.role !== "doctor") {
        alert("Access denied! Doctors only.");
        window.location.href = "login.html";
      }

      const sidebar = document.getElementById("sidebar");
      const hamburger = document.getElementById("hamburger");
      const mainContent = document.getElementById("mainContent");

      hamburger.onclick = () => sidebar.classList.toggle("show");

      function setActive(el) {
        document
          .querySelectorAll(".nav-item")
          .forEach((item) => item.classList.remove("active"));
        el.classList.add("active");
        if (window.innerWidth <= 992) sidebar.classList.remove("show");
      }

      function loadInIframe(url, el) {
        setActive(el);
        mainContent.innerHTML = `<iframe src="${url}"></iframe>`;
      }

      function loadRecentBookings(el) {
        loadInIframe("appointment.html?v=1.0.8", el);
      }

      

      function logout() {
        localStorage.removeItem("user");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
